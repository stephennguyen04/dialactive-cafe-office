<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Insight Café · Sydney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sen:wght@400..800&family=Be+Vietnam+Pro:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A brand opportunity agency in a loft, drawn in a paper-collage style
   AI training session. The office is the interface: click a person or an object to open their work.
   It runs on the office's time: the sky, the clocks, the wall calendar and the decor follow today's date
   in the office's city and the market's calendar (D.calendar). Names, cities and people come from D.brand.
   Look: an editorial system — Sen throughout, cream / ink / dark green / taupe-olive, square
   corners, hairline rules, sentence case (the brand never sets type in all caps). */
:root{
  color-scheme:light;
  --cream:#F8F7F2; --stone:#EFECEC; --white:#FFFFFF; --ink:#252525; --ink2:#505655; --muted:#7A766C;
  --green:#2C332F; --olive:#716A56; --sand:#B6A188; --line:#E3DFD6; --line2:#D2CCBF;
  --clay:#9A4A3A; --gold:#A88A4E; --sage:#6F7D63; --slate:#4E5D78;
  --paper:var(--cream); --cut:var(--white); --soft:#F1EEE6; --coca:var(--clay); --cobalt:var(--slate);
  --font:"Sen","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --hand:var(--font); --display:var(--font); --body:var(--font);
  --shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(20,22,20,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--green);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hand{font-family:var(--font);color:var(--olive);font-size:15px;font-weight:400}
.mono{font-family:var(--mono)} .muted{color:var(--muted)}

/* ---------- the door ---------- */
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--green)}
.gate .card{width:min(420px,100%);background:var(--cream);padding:32px 28px;text-align:center;box-shadow:var(--shadow);border-radius:0}
.gate h1{font-weight:800;letter-spacing:-.01em}
.gate input{width:100%;margin:18px 0 10px;padding:12px 14px;border-radius:6px;border:1px solid var(--line2);font:inherit;background:#fff}
.gate .err{color:var(--clay);min-height:20px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:0;padding:9px 18px;font-weight:700;font-size:13px;background:var(--green);color:var(--cream);text-decoration:none;letter-spacing:.02em}
.btn:hover{background:#1F2522}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink2)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:5px 11px;font-size:12px}

/* ---------- the office ---------- */
.office{position:relative;width:100%;height:100vh;height:100dvh;background:var(--green);display:flex;flex-direction:column;overflow:hidden}
.viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.office .stage{position:relative;width:min(100%,calc((100dvh - 46px) * 16 / 9));aspect-ratio:16/9;flex:none}
@media (max-width:820px){.viewport{overflow-x:auto;justify-content:flex-start;align-items:stretch}.office .stage{width:auto;height:100%;min-width:1100px}}
.office svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{cursor:pointer;transition:filter .2s}
.hot:hover,.hot:focus{filter:drop-shadow(0 0 8px rgba(255,241,214,.95)) drop-shadow(0 0 1px #fff);outline:none}
.idle{animation:bob 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.idle.b{animation-delay:-1.4s}.idle.c{animation-delay:-2.8s}
@keyframes bob{50%{transform:translateY(-3px)}}
.steam{animation:steam 3.2s ease-in-out infinite;opacity:0}.steam.b{animation-delay:-1.1s}.steam.c{animation-delay:-2.2s}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.6}100%{transform:translateY(-22px);opacity:0}}
.twinkle{animation:tw 2.4s ease-in-out infinite}.twinkle.b{animation-delay:-.8s}.twinkle.c{animation-delay:-1.6s}
@keyframes tw{50%{opacity:.3}}
.sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
@keyframes sway{50%{transform:rotate(2deg)}}
.tail{animation:tail 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes tail{50%{transform:rotate(-14deg)}}
.note{animation:note 4s ease-in-out infinite;opacity:0}.note.b{animation-delay:-2s}
@keyframes note{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(18px,-46px);opacity:0}}

/* the bar across the top of the office */
.hud{position:relative;flex:none;height:46px;display:flex;align-items:stretch;z-index:5;background:var(--cream);border-bottom:1px solid var(--line2)}
.plaque{flex:none;padding:7px 18px;font-weight:800;font-size:15px;letter-spacing:-.005em;color:var(--green);line-height:1.15;border-right:1px solid var(--line2);white-space:nowrap;display:flex;flex-direction:column;justify-content:center}
.plaque small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
.hud .right{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none}
.hud .right>:first-child{margin-left:auto} /* not justify-content:flex-end — that pushes overflow off the left edge, out of scroll reach */
.hud .right::-webkit-scrollbar{display:none}
.pill{flex:none;padding:0 14px;font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;gap:7px;align-items:center;white-space:nowrap;border-left:1px solid var(--line)}
@media (max-width:1200px){.plaque small{display:none}.pill.opt{display:none}}
.pill.warn{color:var(--clay)}
.dot{width:7px;height:7px;border-radius:50%;background:#4F8A5B;box-shadow:0 0 0 0 rgba(79,138,91,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(79,138,91,0)}100%{box-shadow:0 0 0 0 rgba(79,138,91,0)}}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;background:var(--green);color:var(--cream);padding:9px 16px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.hint button{background:transparent;border:0;color:var(--sand);font-weight:700}
.chat{position:absolute;z-index:4;max-width:230px;background:#fff;border:1px solid var(--line);padding:8px 11px;font-size:12.5px;line-height:1.4;box-shadow:0 10px 24px -14px rgba(0,0,0,.45);transform:translate(-50%,-100%);animation:pop .35s ease-out;pointer-events:none}
.chat:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;width:10px;height:10px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.chat b{font-weight:700;color:var(--green)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-85%)}to{opacity:1;transform:translate(-50%,-100%)}}
.tip{position:fixed;z-index:6;pointer-events:none;background:var(--green);color:var(--cream);font-size:12.5px;font-weight:700;padding:7px 11px;white-space:nowrap;box-shadow:var(--shadow)}
.tip small{display:block;font-weight:400;opacity:.8}

/* ---------- sheets (what opens when you click) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(28,32,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 14px;overflow-y:auto}
.sheet{position:relative;width:min(1140px,100%);background:var(--cream);box-shadow:var(--shadow);padding:30px 34px 38px;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sheet .x{position:absolute;right:18px;top:18px;border:0;background:var(--green);color:var(--cream);width:34px;height:34px;font-size:18px;line-height:1}
.shead{display:flex;align-items:center;gap:14px;margin:0 50px 22px 0;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line2)}
.shead h1{font-weight:800;font-size:clamp(22px,3vw,30px);margin:0;line-height:1.15;letter-spacing:-.015em;color:var(--green)}
.shead .hand{display:block;margin-top:3px}
.avatar{width:46px;height:46px;border-radius:50%;background:#E7E1D4;overflow:hidden;flex:none;box-shadow:0 0 0 1px var(--line2)}
.avatar.sm{width:30px;height:30px}
.avatar svg{width:100%;height:100%}
.initial{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--cream);flex:none;font-size:14px}
.initial.Me{background:var(--olive);font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font-size:11.5px;font-weight:600;background:transparent;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;border-radius:2px}
.card{background:#fff;border:1px solid var(--line);padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g2,.g3,.g4,.split{grid-template-columns:1fr!important}}
h2.sec{font-size:18px;font-weight:800;margin:30px 0 12px;color:var(--green);letter-spacing:-.01em}
.lbl{font-size:12px;font-weight:700;color:var(--olive);letter-spacing:.01em}
.stamp{font-size:11.5px;font-weight:700;padding:3px 9px;display:inline-block;line-height:1.3;color:#fff;background:var(--ink2)}
.v-Act{background:var(--clay)}.v-This{background:var(--gold)}.v-Watch{background:var(--slate)}.v-Skip{background:#A8A398}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);background:#fff}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 18px;border-left:1px solid var(--line)}.kpi:first-child{border-left:0}
.kpi b{display:block;font-size:30px;line-height:1.1;font-weight:800;color:var(--green)}
.kpi span{font-size:12.5px;color:var(--muted)}
.three{display:grid;gap:10px}
.three .row{display:flex;gap:14px;align-items:flex-start}
.three .n{font-size:22px;font-weight:800;line-height:1.1;color:var(--sand);width:22px;flex:none}
.filters{display:flex;gap:0;flex-wrap:wrap;margin:0 0 18px;border:1px solid var(--line2);width:max-content;max-width:100%}
.filters button{border:0;background:#fff;padding:7px 14px;font-weight:600;font-size:13px;border-left:1px solid var(--line2)}
.filters button:first-child{border-left:0}
.filters button.on{background:var(--green);color:var(--cream)}
/* opportunity cards */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tc{position:relative;background:#fff;border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.tc:hover{transform:translateY(-2px);box-shadow:0 16px 30px -22px rgba(0,0,0,.5)}
.tc .cover{position:relative;aspect-ratio:16/10;background:var(--stone);overflow:hidden}
.tc .cover img{width:100%;height:100%;object-fit:cover;display:block}
.tc .cover .stamp{position:absolute;top:10px;left:10px}
.tc .cover .plat{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.tc .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tc h3{font-size:17px;font-weight:800;margin:0;line-height:1.25;color:var(--green)}
.tc .ins{font-size:13.5px;color:var(--ink2)}
.tc .foot{display:flex;align-items:center;gap:10px;margin-top:auto}
.rel{font-size:24px;font-weight:800;line-height:1;color:var(--green)}
.rel small{font-size:12px;color:var(--muted);font-weight:400}
.ptag{font-size:10.5px;font-weight:700;color:#fff;padding:2px 6px;letter-spacing:.01em}
.p-Meta{background:#3E4F86}.p-TikTok{background:#252525}.p-Instagram{background:#7B4A63}.p-Pinterest{background:#8E3B3B}.p-YouTube{background:#9A4A3A}.p-Reddit{background:#9A5A3A}.p-News{background:#5B5F6E}.p-Search{background:var(--slate)}.p-Calendar{background:var(--gold)}
/* dossier */
.hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ev{position:relative;display:block;overflow:hidden;background:var(--stone);aspect-ratio:4/5;text-decoration:none;border:1px solid var(--line)}
.ev img{width:100%;height:100%;object-fit:cover;display:block}
.ev .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;background:linear-gradient(transparent,rgba(20,22,20,.82));color:#fff;font-size:11.5px;line-height:1.3}
.ev .cap b{display:block;font-size:11px;opacity:.85}
.ev .ptag{position:absolute;top:7px;left:7px}
.ev.txt{aspect-ratio:auto;min-height:110px;align-self:start;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:11px;background:#fff;font-size:12.5px}
.ev.txt .ptag{position:static;align-self:flex-start}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);background:#fff}
@media (max-width:820px){.boxes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.box{padding:14px 16px;font-size:14px;border-left:1px solid var(--line)}.box:first-child{border-left:0}
.box .lbl{display:block;margin-bottom:5px}
.b1 .lbl{color:var(--slate)}.b2 .lbl{color:var(--sage)}.b3 .lbl{color:var(--clay)}.b4 .lbl{color:var(--gold)}
.bars{display:grid;gap:8px;width:100%}
.bar{display:grid;grid-template-columns:88px 1fr 22px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{height:6px;background:var(--stone);overflow:hidden}
.bar .t i{display:block;height:100%}
.live{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
/* plays: stickies + sheets */
.board{background:#FCFBF8;padding:20px;border:1px solid var(--line2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.colh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.colh h2{font-size:20px;font-weight:800;margin:0;color:var(--green)}
.stickies{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.sticky{position:relative;padding:13px 13px 11px;min-height:150px;cursor:pointer;box-shadow:0 8px 14px -12px rgba(0,0,0,.45);transition:transform .15s;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.sticky:nth-child(odd){transform:rotate(-1deg)}.sticky:nth-child(even){transform:rotate(.8deg)}
.sticky:hover{transform:rotate(0) scale(1.02)}
.sticky b{font-size:15px;line-height:1.25;font-weight:700;color:var(--ink)}
.f-Awareness{background:#EFE6C8}.f-Consideration{background:#EAD8D0}.f-Conversion{background:#D8E1D2}
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.mood{background:#fff;border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .15s}
.mood:hover{transform:translateY(-2px)}
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:4/3;background:var(--line)}
.collage div{background:var(--stone) center/cover no-repeat}
.collage div:first-child{grid-row:1/3}
.mood .body{padding:14px 16px 16px}
.mood h3{font-size:17px;font-weight:800;margin:8px 0 6px;line-height:1.25;color:var(--green)}
.mood .mhook{font-size:14.5px;color:var(--ink2)}
.hooks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--green)}
@media (max-width:820px){.hooks{grid-template-columns:1fr}}
.hook{background:var(--green);color:var(--cream);padding:16px 18px;font-size:16.5px;font-weight:600;line-height:1.35;border-left:1px solid #3E4741}
.hook:first-child{border-left:0}
.hook small{display:block;font-size:11.5px;font-weight:700;color:var(--sand);margin-bottom:6px}
.story{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.frame{flex:0 0 180px;background:var(--green);color:var(--cream);padding:12px;font-size:13px;min-height:120px;position:relative}
.frame .n{font-family:var(--mono);font-size:11px;color:var(--sand)}
.frame.slide{background:#fff;color:var(--ink);border:1px solid var(--line)}
.frame.slide .n{color:var(--olive)}
.tactics{display:grid;gap:8px}
.tactics label{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:#fff;padding:10px 13px;border:1px solid var(--line);cursor:pointer}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ref{display:flex;flex-direction:column;background:#fff;text-decoration:none;border:1px solid var(--line);overflow:hidden}
.ref .im{position:relative;aspect-ratio:4/5;background:var(--stone)}
.ref .im img{width:100%;height:100%;object-fit:cover;display:block}
.ref .im.words{aspect-ratio:auto;min-height:120px;padding:34px 12px 12px;font-size:14px;line-height:1.4;color:var(--ink2);background:var(--soft)}
.ref .im .ptag{position:absolute;top:7px;left:7px}
.ref .t{padding:10px 11px 12px;font-size:12.5px;line-height:1.4}
.ref .t b{display:block;font-size:11.5px;color:var(--olive);margin-bottom:3px}
.ref .t em{display:block;font-style:normal;margin-top:5px}
.slip{position:relative;padding:16px 16px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--green)}
.slip p{margin:0 0 10px;font-size:15px;line-height:1.5}
.slip .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.doc{background:#fff;padding:16px 18px;font-size:13.5px;white-space:pre-wrap;border:1px solid var(--line);border-top:3px solid var(--green)}
.prod{display:flex;gap:12px;align-items:center}
.prod img{width:74px;height:74px;object-fit:cover;background:var(--stone)}
.quote{font-size:16.5px;line-height:1.45;border-left:3px solid var(--sand);padding:4px 0 4px 16px;color:var(--ink)}
/* huddle */
.hq{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:flex-start;margin-bottom:14px}
.bub{background:#fff;padding:12px 14px;border:1px solid var(--line);font-size:14px}
.hq textarea{width:100%;min-height:60px;padding:10px 12px;border-radius:6px;border:1px solid var(--line2);font:inherit;font-size:14px;background:#fff;resize:vertical;margin-top:8px}
.learned{font-size:12.5px;color:var(--sage);margin-top:5px}
.table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--line)}
.table th,.table td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-size:12px;color:var(--olive);font-weight:700}
.rulebook h1{font-size:24px;font-weight:800;color:var(--green)}.rulebook h2{font-size:18px;font-weight:800;margin:22px 0 6px;color:var(--green)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--cream);padding:10px 18px;font-weight:600;z-index:60;font-size:13.5px}
.dock{display:none}
@media (max-width:820px){
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8;gap:0;overflow-x:auto;background:rgba(44,51,47,.97);padding:6px 4px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none}
  .dock button{flex:none;border:0;background:transparent;color:var(--cream);font-size:11px;font-weight:600;padding:4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .dock button:active{background:rgba(255,255,255,.12)}
  .hint{display:none!important}
  .sheet-wrap{padding:12px 8px 90px}.sheet{padding:18px 14px 24px}
}
/* the creative ads chamber */
.chamber .kpis{margin-bottom:6px}
.adwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ad{background:#fff;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.ad .im,.ref .im{position:relative;aspect-ratio:4/5;background:#1F1A24}
.ad .im img{width:100%;height:100%;object-fit:cover;display:block}
.ad .im[data-video]{cursor:pointer}
.playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(20,16,24,.72);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.days{position:absolute;left:8px;top:8px;background:rgba(248,247,242,.95);padding:2px 8px;font-size:11px;font-weight:700;color:var(--ink)}
.days.hot{background:var(--green);color:var(--cream)}
.fmt{position:absolute;right:8px;bottom:8px;background:rgba(37,37,37,.78);color:#fff;padding:2px 6px;font-size:10.5px;font-weight:700;text-transform:capitalize}
.ad .t{padding:10px 11px 12px;font-size:13px;line-height:1.35}
.hookline{font-size:14px;font-weight:700;margin-top:5px;line-height:1.35;color:var(--green)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:12px;font-weight:600}
.links a{color:var(--olive);text-decoration:none;border-bottom:1px solid var(--line2)}
.chip.ang{border-color:#D9B9AE;color:var(--clay)}.chip.con{border-color:#BFC7D6;color:var(--slate)}
.pattern .pt{font-size:16px;font-weight:700;line-height:1.35;color:var(--green)}
.pattern .thumbs{display:flex;gap:6px;margin:10px 0}
.pattern .th{width:64px;height:80px;background:#1F1A24 center/cover;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;text-shadow:0 1px 4px #000}
.pattern .th[data-video]{cursor:pointer}
.pattern .use{font-size:13.5px}
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.testcard{background:#fff;padding:16px;border:1px solid var(--line);border-top:3px solid var(--green);cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:transform .15s}
.testcard:hover{transform:translateY(-2px)}
.testcard b{font-size:16px;font-weight:800;line-height:1.3;color:var(--green)}
.vocq{font-size:14px;color:var(--olive);line-height:1.4;border-left:2px solid var(--sand);padding-left:10px}
.acmap{display:grid;grid-template-columns:118px repeat(10,minmax(0,1fr));gap:3px;font-size:11px}
.acmap .ch{text-align:center;font-weight:700}.acmap .ch small,.acmap .rh small{display:block;font-weight:500;color:var(--muted);font-size:9.5px;line-height:1.15}
.acmap .rh{font-weight:700;align-self:center}
.acmap .cell{aspect-ratio:1.5;background:#F1EEE6;display:flex;align-items:center;justify-content:center}
.acmap .cell i{font-style:normal;font-weight:700;color:#fff;background:var(--slate);border-radius:50%;width:calc(14px + var(--n)*4px);height:calc(14px + var(--n)*4px);display:flex;align-items:center;justify-content:center;font-size:10px}
.acmap .cell.ours{box-shadow:inset 0 0 0 2.5px var(--coca)}
@media (max-width:700px){.acmap{grid-template-columns:44px repeat(10,minmax(0,1fr))}.acmap small{display:none!important}}
video.player{width:100%;max-height:70vh;background:#000}
.spybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:10px 14px}
.spybar b{color:var(--green)}
.fitb{position:absolute;right:8px;top:8px;background:var(--green);color:var(--cream);padding:2px 7px;font-size:11px;font-weight:700}
/* the trend radar */
.spot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border:1px solid var(--line)}
.spot>div{padding:12px 14px;border-left:1px solid var(--line)}.spot>div:first-child{border-left:0}
.spot p{margin:5px 0 0;font-size:13.5px}
@media (max-width:900px){.spot{grid-template-columns:1fr 1fr}.spot>div{border-left:0;border-top:1px solid var(--line)}}
.radarsvg{width:100%;height:auto;display:block}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ritem{background:#fff;border:1px solid var(--line);padding:14px 16px;font-size:13.5px;transition:box-shadow .3s}
.ritem.flash,.tag.flash{box-shadow:0 0 0 3px var(--sand)}
.ritem p{margin:6px 0}
.rtop{display:flex;gap:8px;align-items:center}.rtop b{font-size:15px;color:var(--green);line-height:1.3}
.heat{color:#fff;font-size:11px;font-weight:700;padding:2px 7px;white-space:nowrap}
.rmeter{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font-size:11.5px;color:var(--muted);margin:8px 0}
.rmeter i{display:block;height:5px;background:var(--stone)}.rmeter i b{display:block;height:100%;background:var(--clay)}
.rev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rev a{display:flex;gap:6px;align-items:center;text-decoration:none;font-size:11.5px;color:var(--olive);border:1px solid var(--line);padding:3px 8px 3px 3px;max-width:100%}
.rev img{width:34px;height:34px;object-fit:cover}.rev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tag{background:#fff;border:1px solid var(--line);padding:9px 12px;max-width:320px}.tag b{display:block;color:var(--green)}.tag span{font-size:13px;color:var(--ink2)}
.cal7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line)}
.cal7>div{padding:10px 12px;border-left:1px solid var(--line);font-size:13px}.cal7>div:first-child{border-left:0}
.cal7 b{display:block;color:var(--green)}
@media (max-width:900px){.cal7{grid-template-columns:1fr}.cal7>div{border-left:0;border-top:1px solid var(--line)}}
/* the huddle */
.hstatus{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:3px solid var(--green);padding:12px 14px;margin-bottom:18px;font-size:14px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.learned-list{display:grid;gap:0;background:#fff;border:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.lrow:first-child{border-top:0}.lrow .muted{font-size:12px;white-space:nowrap}
@media (max-width:600px){.lrow{grid-template-columns:1fr auto}.lrow .muted{display:none}}
/* overheard — voice of customer */
.vrow{margin:12px 0}.vtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.vtop .vn{margin-left:auto;font-size:19px;font-weight:800;color:var(--green)}
.vbar{height:6px;background:var(--stone);overflow:hidden;margin:5px 0}.vbar i{display:block;height:100%}
.vbar i.good{background:var(--sage)}.vbar i.bad{background:var(--clay)}
.vq{font-size:14px;color:var(--ink2);line-height:1.45}
.srcl{font-size:11.5px;font-weight:700;color:var(--olive);text-decoration:none;white-space:nowrap}
.qa .qq{font-weight:700;color:var(--green)}.qa .aa{margin-top:6px;padding-left:12px;border-left:2px solid var(--sage);color:var(--ink2)}
.lang{display:flex;flex-wrap:wrap;gap:8px}
.lq{background:#fff;padding:7px 12px;border:1px solid var(--line);border-left:3px solid var(--c);font-size:14px}
.chip.comp.better{border-color:#D9B9AE;color:var(--clay)}.chip.comp.worse{border-color:#C3CDBB;color:var(--sage)}
/* the US calendar room */
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cd{min-height:66px;background:#fff;padding:4px 5px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cd.empty{background:transparent;border-color:transparent}.cd.past{opacity:.55}.cd.today{border:2px solid var(--clay)}
.cd .dn{font-size:12px;font-weight:700}
.ce{font-size:10.5px;line-height:1.2;border-left:3px solid var(--k);padding-left:4px;color:#3A3340}.ce.cont{opacity:.55}
.mhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.mhead b{font-size:18px;font-weight:800;color:var(--green)}
.crow{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cdate b{display:block;font-size:13px}.cdate span{font-size:12px;color:var(--muted)}
.bn{margin-top:5px;font-size:12.5px;background:#F3E6E1;color:var(--clay);padding:4px 9px;display:inline-block}
.bigclock{font-size:42px;font-weight:800;line-height:1.05;margin:4px 0;color:var(--green)}
@media (max-width:600px){.ce{font-size:0;border-left:0;padding:0;width:7px;height:7px;border-radius:50%;background:var(--k);display:inline-block;margin-right:2px}
  .cd{min-height:42px;flex-direction:row;flex-wrap:wrap;align-content:flex-start}.cd .dn{width:100%}}
/* weather outside the windows */
.snow{animation:snow 9s linear infinite}
@keyframes snow{from{transform:translateY(-20px)}to{transform:translateY(470px)}}
.leaf{animation:leaf 11s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes leaf{0%{transform:translate(0,-20px) rotate(0deg)}50%{transform:translate(18px,220px) rotate(180deg)}100%{transform:translate(-6px,470px) rotate(360deg)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
/* the shared reading path: room bar → the answer → numbered findings → the appendix, folded */
.rnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:-8px 46px 16px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rnav::-webkit-scrollbar{display:none}
.rnav button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:4px 10px 4px 5px;cursor:pointer}
.rnav button .avatar.sm,.rnav button .initial{width:24px;height:24px;font-size:10px}
.rnav button.on{border-color:var(--green);color:var(--green);background:#fff}
.rnav button:hover{color:var(--ink)}
.answer{border-left:4px solid var(--green);background:#fff;padding:14px 20px;margin:0 0 16px}
.answer p{margin:0;font-size:clamp(17px,2vw,21px);line-height:1.35;font-weight:700;color:var(--ink)}
.answer .meta{margin-top:6px;font-size:12.5px;color:var(--muted)}
.answer .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3E8E5E;margin-right:2px;vertical-align:1px}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.jump a{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff;padding:4px 10px}
.jump a b{font-size:11px;color:var(--muted)}
.jump a:hover{border-color:var(--green)}
.secn{display:inline-grid;place-items:center;width:22px;height:22px;background:var(--green);color:var(--cream);font-size:12px;font-weight:800;margin-right:9px;vertical-align:2px;flex:none}
h2.sec small,summary small{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:10px;letter-spacing:0}
.finds{display:grid;gap:12px}
.find{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;background:#fff;border:1px solid var(--line);padding:16px 18px}
.find .fn{font-size:26px;font-weight:800;color:var(--sand);line-height:1}
.find h3{margin:2px 0 10px;font-size:17px;line-height:1.3;color:var(--green)}
.find .ftop{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.find dl{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px;line-height:1.45}
.find dt{font-size:12px;font-weight:700;color:var(--olive);padding-top:2px}
.find dd{margin:0}
.find .rev,.find .thumbs{margin-top:10px}
.find[data-trend]:hover{border-color:var(--green)}
.proof{display:inline-block;font-size:12px;font-weight:700;background:#EEF0E8;color:var(--green);padding:1px 7px;margin-left:2px}
.proof.na{background:var(--soft);color:var(--muted);font-weight:500}
.own{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-left:4px;vertical-align:middle;color:var(--ink2)}
.own .initial{width:20px;height:20px;font-size:9px}
.own.none{color:var(--muted);font-weight:500}
.chip.brand{border-color:var(--green);color:var(--green);font-weight:800}
details.appx{margin-top:28px;border-top:1px solid var(--line2);padding-top:14px}
details.appx>summary{cursor:pointer;font-weight:800;font-size:17px;color:var(--green);list-style:none;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
details.appx>summary::-webkit-details-marker{display:none}
details.appx>summary::after{content:"Show";margin-left:auto;font-size:12px;font-weight:700;color:var(--green);border:1px solid var(--line2);padding:3px 12px;background:#fff}
details.appx[open]>summary::after{content:"Hide"}
.sigsec{margin-bottom:14px}
.sigrow{display:grid;grid-template-columns:auto minmax(0,.9fr) minmax(0,1.5fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sigrow.two{grid-template-columns:minmax(0,.6fr) minmax(0,1.6fr) auto}
.sigrow .heat{font-size:10.5px}
.wl{margin:6px 0;font-size:13.5px;line-height:1.45}
.deskrow{display:grid;grid-template-columns:auto 112px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:10px 14px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}
.deskrow .dl{font-weight:800;color:var(--green)}
.deskrow .dt{font-size:14px;line-height:1.4}
.deskrow .go{font-size:12px;font-weight:700;color:var(--green);white-space:nowrap}
.deskrow:hover{border-color:var(--green)}
.kpi small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi small.up{color:#15624A}.kpi small.down{color:var(--clay)}
.hbars .hb{display:grid;grid-template-columns:150px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.hbars i{display:block;height:10px;background:var(--sand)}
.hbars b{text-align:right}
details.tl{background:#fff;border:1px solid var(--line);margin-bottom:8px}
details.tl>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;padding:12px 16px;align-items:center}
details.tl>summary::-webkit-details-marker{display:none}
details.tl[open]>summary{border-bottom:1px solid var(--line)}
.tlt b{display:block;font-size:13px;color:var(--green)}.tlt span{font-size:12px;color:var(--muted)}
.tlh{font-weight:700;font-size:15px;line-height:1.35}
.tlb{padding:12px 16px 14px 232px}
.tlf{margin:2px 0 12px;padding-left:18px;font-size:14px;line-height:1.45}.tlf li{margin:3px 0}
.tld{display:grid;gap:7px;margin:4px 0 12px}.tld>div{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.tld .avatar.sm{width:24px;height:24px;flex:none}
.tlp{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 8px;font-size:13.5px}.tlp span{display:inline-flex;gap:6px;align-items:center}.tlp .initial{width:20px;height:20px;font-size:9px}
.tln{font-size:12.5px;margin:10px 0 0}
@media (max-width:760px){.find{grid-template-columns:1fr;gap:4px}.find .fn{font-size:18px}.find dl{grid-template-columns:1fr;gap:2px}.find dd{margin-bottom:6px}
  .deskrow{grid-template-columns:auto minmax(0,1fr)}.deskrow .dt{grid-column:1/-1}.deskrow .go{display:none}
  details.tl>summary{grid-template-columns:1fr;gap:4px}.tlb{padding:12px 16px 14px}.sigrow,.sigrow.two{grid-template-columns:minmax(0,1fr) auto}.sigrow span{grid-column:1/-1}
  .rnav{margin-right:40px}.hbars .hb{grid-template-columns:100px minmax(0,1fr) 24px}}
/* proof beside every finding, the funnel ideas, our reviews, the occasion pulse */
.find.hasvis{grid-template-columns:34px minmax(0,1fr) 240px}
.fvis{position:relative;display:block;align-self:start;overflow:hidden;background:var(--stone);aspect-ratio:4/5;border:1px solid var(--line);text-decoration:none}
.fvis img{width:100%;height:100%;object-fit:cover;display:block}
.fvis .fcap{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;background:linear-gradient(transparent,rgba(20,22,20,.85));color:#fff;font-size:11.5px;line-height:1.35}
.fvis .fcap b{display:block;font-size:11px;opacity:.85}
.fvis.txt{aspect-ratio:auto;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14px;background:var(--soft);color:var(--ink);font-size:13.5px;line-height:1.4}
.fvis.txt b{font-size:11.5px;color:var(--olive)}.fvis.txt em{font-style:normal;font-size:12px;font-weight:700;color:var(--green)}
.fbadge{position:absolute;right:7px;top:7px;background:rgba(248,247,242,.94);color:var(--ink);font-size:10.5px;font-weight:700;padding:2px 7px}
.fsrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fsrc a,.fsrc .nolink{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--olive);text-decoration:none;border:1px solid var(--line);padding:2px 8px 2px 2px;max-width:100%}
.fsrc .nolink{padding:3px 8px}
.fsrc img{width:28px;height:28px;object-fit:cover}
.fsrc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.srcl img.mini{width:22px;height:22px;object-fit:cover;vertical-align:middle;margin-right:5px}
.ptiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ptile{position:relative;display:block;width:104px;height:130px;overflow:hidden;background:#1F1A24;text-decoration:none}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile .pplay{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:#fff;font-size:18px;text-shadow:0 1px 6px #000}
.ptile .pcap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:10.5px;line-height:1.25}
.fungrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.funh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;padding:10px 12px;background:var(--green);color:var(--cream);margin-bottom:10px}
.funh b{font-size:16px}.funh span{font-weight:700;font-size:13px}.funh small{flex-basis:100%;font-size:12px;opacity:.85}
.idea{background:#fff;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.iim{position:relative;aspect-ratio:4/3;background:#1F1A24;cursor:default}.iim[data-video]{cursor:pointer}
.iim img{width:100%;height:100%;object-fit:cover;display:block}
.ifmt{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 8px;background:var(--cream);color:var(--green)}
.ifmt.video{background:var(--clay);color:#fff}
.icap{position:absolute;left:0;right:0;bottom:0;padding:18px 9px 7px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:11px}
.ib{padding:12px 14px 14px}.ib h3{margin:0 0 6px;font-size:15.5px;color:var(--green);line-height:1.3}
.ib dl{display:grid;grid-template-columns:1fr;gap:2px;margin:8px 0 0;font-size:13px;line-height:1.45}.ib dt{font-size:11.5px;font-weight:700;color:var(--olive);margin-top:5px}.ib dd{margin:0}
.ichips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.rate{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:8px 10px;text-decoration:none;color:var(--ink)}
.rate img{width:44px;height:44px;object-fit:contain;background:#fff;flex:none}
.rate b{font-size:20px;color:var(--green);margin-right:4px}.rate small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.stars{font-size:12px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold) calc(var(--r)/5*100%),#D9D3C7 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.bub.warnb{background:#FBE9E5;border-left:3px solid var(--clay);margin-top:12px}
.peers{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.peer{background:#fff;border:1px solid var(--line);padding:14px 16px}.peer h3{margin:8px 0 6px;font-size:15px;color:var(--green)}
.peer .lev{margin:10px 0 0;font-size:13.5px;font-weight:600}.peer .lev .lbl{display:block;margin-bottom:2px}
.peer{position:relative}.pim{float:right;width:64px;height:64px;margin:0 0 6px 10px;border:1px solid var(--line);background:#fff}.pim img{width:100%;height:100%;object-fit:contain}
.acts{display:grid;gap:0;padding:4px 18px}
.act{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1.3fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.act:last-child{border-bottom:0}
.ocban{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);padding:22px 20px 16px;margin-bottom:16px;overflow:hidden}
.ocban::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--c1) 0 26px,var(--c2) 26px 52px)}
.ocicon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--c1) 18%,#fff);border:2px solid var(--c1)}
.octx h2{margin:2px 0 4px;font-size:clamp(19px,2.4vw,24px);color:var(--green)}.octx p{margin:0;color:var(--ink2);font-size:14px}
.occlk{display:grid;gap:3px;text-align:right;font-size:12px;color:var(--muted)}.occlk b{color:var(--ink);font-size:14px}
.find.occ .fn{font-size:26px}
.omood{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--ink)}
.ins{display:grid;gap:0}
.insr{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.ik{font-size:11px;font-weight:800;color:#fff;background:var(--k);padding:2px 0;text-align:center}
.tl60{padding:4px 16px}
.tlrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tlrow:last-child{border-bottom:0}.tldate{font-weight:700;color:var(--green)}.tlrow .bn{display:block;font-size:12.5px;color:var(--clay);margin-top:2px}
@media (max-width:900px){.fungrid{grid-template-columns:1fr}.find.hasvis{grid-template-columns:34px minmax(0,1fr)}.find.hasvis .fvis{grid-column:1/-1;aspect-ratio:16/10;order:-1}}
@media (max-width:760px){.find.hasvis{grid-template-columns:1fr}.act{grid-template-columns:1fr}.ocban{grid-template-columns:auto minmax(0,1fr)}.occlk{grid-column:1/-1;text-align:left;grid-auto-flow:column;justify-content:start;gap:12px}
  .insr{grid-template-columns:54px minmax(0,1fr)}.insr .srcl{grid-column:2}.tlrow{grid-template-columns:76px minmax(0,1fr)}.tlrow>.muted{grid-column:2}}
/* the trial: locked rooms, the teaser sheets, the ribbon */
.trialbar{position:fixed;left:16px;bottom:16px;z-index:9;display:flex;align-items:center;gap:10px;border:0;cursor:pointer;background:var(--green);color:var(--cream);
  font:600 13px var(--font);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow)}
.trialbar b{background:var(--gold);color:var(--white);border-radius:999px;padding:2px 10px;font-size:12px}.trialbar i{font-style:normal;opacity:.85}
.lockcard{border-left:3px solid var(--gold)}.lockico{font-size:26px;margin-bottom:6px}
.fl{margin:6px 0 0;padding-left:20px}.fl li{margin:4px 0}
.fullgrid .avatar{display:block;width:46px;height:46px;border-radius:50%;overflow:hidden}.fullgrid .avatar svg{width:100%;height:100%;display:block}
.dock button.locked{opacity:.6}.dock button .lk{font-size:10px}
.lockplay{display:flex;gap:10px;align-items:flex-start;opacity:.8}.lockplay .lk{margin-left:auto}
@media (max-width:760px){.trialbar{bottom:72px;left:10px;right:10px;justify-content:center}.trialbar i{display:none}}
/* language switch (VI | EN) */
.langsw{position:fixed;top:8px;right:8px;z-index:30;display:none;border:1px solid var(--line2);background:var(--cream);box-shadow:var(--shadow);font:700 12.5px/1 var(--body,system-ui)}
.langsw.on{display:flex}
.langsw button{border:0;background:transparent;padding:8px 11px;cursor:pointer;color:var(--muted);font:inherit;letter-spacing:.04em}
.langsw button.on{background:var(--green);color:var(--cream)}
@media (max-width:760px){.langsw{top:auto;bottom:74px;right:8px}}
</style>
</head>

  <div class="card">
    <div id="gateFace"></div>
    <h1 style="font-family:var(--display);font-size:26px;margin:0">The Insight Café</h1>

    <form id="gateForm"><input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase">

</div>

<script>
"use strict";
/* ============================= the crew (paper cut-outs) ============================= */
const CK={hair:"#2A1A16",lip:"#C9575C",blush:"#F08C86",gold:"#D7A536",white:"#FFFDF8"};
const CUT=`<filter id="cut" x="-15%" y="-15%" width="130%" height="130%"><feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/><feFlood flood-color="#FFFDF8"/><feComposite in2="d" operator="in" result="w"/><feGaussianBlur in="d" stdDeviation="3" result="b"/><feOffset in="b" dx="2" dy="5" result="o"/><feFlood flood-color="#1B1620" flood-opacity=".28"/><feComposite in2="o" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
function shade(hex,f){const n=parseInt(hex.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f))));return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");}
let eyeSeq=0;
function eyes(m,hair){
  const id=++eyeSeq;
  if(m==="happy") return [98,142].map(x=>`<path d="M${x-13} 126 Q${x} 114 ${x+13} 126" stroke="${hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`).join("");
  if(m==="wink") return `<path d="M85 126 Q98 117 111 126" stroke="${hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`+eye(142,4,0);
  const dx=m==="think"?3:m==="side"?7:5, dy=m==="think"?-4:0;
  return eye(98,dx,dy)+eye(142,dx,dy);
  function eye(x,dx,dy){const r=7.4;return `<path d="M${x-15} 125 Q${x} 111 ${x+15} 124 Q${x} 135 ${x-15} 125Z" fill="#fff"/><clipPath id="e${id}${x}"><path d="M${x-15} 125 Q${x} 111 ${x+15} 124 Q${x} 135 ${x-15} 125Z"/></clipPath><g clip-path="url(#e${id}${x})"><circle cx="${x+dx}" cy="${125+dy}" r="${r}" fill="#4A2C1E"/><circle cx="${x+dx}" cy="${125+dy}" r="${r*.5}" fill="#1A0F0B"/><circle cx="${x+dx+2.6}" cy="${122+dy}" r="2.3" fill="#fff"/></g><path d="M${x-15} 124 Q${x} 110 ${x+15} 123" stroke="${hair}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;}
}
function brows(m,hair){const up=m==="think"?-3:0;return `<path d="M83 ${106+up} Q97 ${98+up} 111 ${104+up}" stroke="${hair}" stroke-width="5.5" fill="none" stroke-linecap="round"/><path d="M129 ${104+up} Q143 ${98+up} 157 ${106+up}" stroke="${hair}" stroke-width="5.5" fill="none" stroke-linecap="round"/>`;}
function mouth(m){
  if(m==="think"||m==="side") return `<path d="M108 168 Q118 164 133 165 Q122 173 108 168Z" fill="${CK.lip}"/>`;
  if(m==="happy"||m==="wink") return `<path d="M104 161 Q120 182 136 161 Q120 166 104 161Z" fill="#7A2A30"/><path d="M107 163 Q120 168 133 163 L131 166 Q120 170 109 166Z" fill="#fff"/>`;
  return `<path d="M105 163 Q112 158 120 161 Q128 158 135 163 Q120 175 105 163Z" fill="${CK.lip}"/>`;
}
function spark(x,y,s,c,rot){return `<g transform="translate(${x} ${y}) rotate(${rot||0}) scale(${s})"><g stroke="${c}" stroke-width="3.4" stroke-linecap="round"><path d="M0 -9v18M-9 0h18M-6.4 -6.4l12.8 12.8M6.4 -6.4l-12.8 12.8"/></g></g>`;}
function head(look,m){
  const hair=look.hairColor||CK.hair, hh=shade(hair,1.6), skin=look.skin, skinS=shade(skin,.86), style=look.hair, top=look.top;
  let back="", crown="", fringe="", acc="";
  if(style==="bun"){crown=`<circle cx="120" cy="34" r="28" fill="${hair}"/><path d="M100 26 Q112 12 130 16" stroke="${hh}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M92 58 q6-9 14-2 q7-9 14 0 q7-9 14 0 q8-7 14 2 q-28 12 -56 0Z" fill="${top}"/>`;}
  if(style==="bun"||style==="braid") back=`<path d="M58 120 Q56 62 120 58 Q184 62 182 120 Q184 150 170 168 L70 168 Q56 150 58 120Z" fill="${hair}"/>`;
  if(style==="bob"||style==="beret") back=`<path d="M54 118 Q52 58 120 56 Q188 58 186 118 L188 170 Q170 178 160 170 L80 170 Q70 178 52 170Z" fill="${hair}"/>`;
  if(style==="curly"){let c="";[[62,92,24],[56,124,24],[62,156,22],[84,70,24],[120,58,28],[156,70,24],[178,92,24],[184,124,24],[178,156,22]].forEach(([x,y,r])=>c+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${hair}"/>`);back=c;}
  if(style==="short") back=`<path d="M62 120 Q60 64 120 60 Q180 64 178 120 L176 138 Q170 110 160 104 L80 104 Q70 110 64 138Z" fill="${hair}"/>`;
  if(style==="braid") back+=`<g fill="${hair}">${[0,1,2,3,4].map(i=>`<ellipse cx="${176+i*2}" cy="${176+i*22}" rx="13" ry="13"/>`).join("")}</g><circle cx="186" cy="282" r="7" fill="${top}"/>`;
  const face=`<ellipse cx="63" cy="134" rx="9" ry="13" fill="${skinS}"/><ellipse cx="177" cy="134" rx="9" ry="13" fill="${skinS}"/><path d="M66 112 Q66 84 120 80 Q174 84 174 112 Q176 160 150 182 Q135 194 120 194 Q105 194 90 182 Q64 160 66 112Z" fill="${skin}"/>`;
  if(style==="bun"||style==="braid") fringe=`<path d="M66 112 Q70 72 120 70 Q170 72 174 112 Q160 88 124 86 L120 76 L116 86 Q80 88 66 112Z" fill="${hair}"/>`;
  if(style==="bob"||style==="beret") fringe=`<path d="M64 112 Q64 70 120 68 Q176 70 176 112 Q168 98 150 100 Q120 104 90 100 Q72 98 64 112Z" fill="${hair}"/>`;
  if(style==="curly") fringe=`<g fill="${hair}"><circle cx="86" cy="88" r="16"/><circle cx="110" cy="82" r="16"/><circle cx="134" cy="82" r="16"/><circle cx="156" cy="90" r="15"/></g>`;
  if(style==="short") fringe=`<path d="M64 110 Q68 66 128 66 Q178 70 176 112 Q156 84 112 92 Q86 96 64 110Z" fill="${hair}"/>`;
  if(style==="beret") crown=`<path d="M58 78 Q70 30 128 30 Q186 34 184 74 Q150 84 110 82 Q76 84 58 78Z" fill="${top}"/><circle cx="128" cy="30" r="5" fill="${shade(top,.7)}"/>`;
  if(look.acc==="clip") acc+=spark(160,78,1,"#D97757",14);
  if(look.acc==="glasses") acc+=`<g fill="none" stroke="#241E2A" stroke-width="3.2"><circle cx="98" cy="126" r="16"/><circle cx="142" cy="126" r="16"/><path d="M114 124 Q120 120 126 124"/></g>`;
  if(look.acc==="pencil") acc+=`<g transform="rotate(-28 176 112)"><rect x="168" y="70" width="9" height="64" rx="2" fill="#F2B530"/><path d="M168 134 L172.5 146 L177 134Z" fill="#F6D9B0"/><rect x="168" y="70" width="9" height="8" fill="#F26D9E"/></g>`;
  if(look.acc==="earring"||style==="bun") acc+=`<circle cx="62" cy="152" r="7.5" fill="none" stroke="${CK.gold}" stroke-width="3.4"/><circle cx="178" cy="152" r="7.5" fill="none" stroke="${CK.gold}" stroke-width="3.4"/>`;
  if(look.acc==="headset") acc+=`<path d="M58 128 Q56 54 120 52 Q184 54 182 128" stroke="#241E2A" stroke-width="7" fill="none"/><rect x="48" y="118" width="18" height="30" rx="7" fill="${top}"/><rect x="174" y="118" width="18" height="30" rx="7" fill="${top}"/><path d="M57 146 Q60 176 96 178" stroke="#241E2A" stroke-width="3.4" fill="none"/><circle cx="98" cy="178" r="5" fill="#241E2A"/>`;
  return `<g>${back}${crown}${face}${fringe}<ellipse cx="88" cy="150" rx="13" ry="8" fill="${CK.blush}" opacity=".5"/><ellipse cx="152" cy="150" rx="13" ry="8" fill="${CK.blush}" opacity=".5"/>${brows(m,hair)}${eyes(m,hair)}<path d="M123 134 Q127 146 125 149 Q121 152 116 150" stroke="${skinS}" stroke-width="2.6" fill="none" stroke-linecap="round"/>${mouth(m)}${acc}</g>`;
}
function torso(look,arm){
  const top=look.top, topS=shade(top,.8), skin=look.skin, skinS=shade(skin,.86);
  const apron=look.hair==="bun"?`<path d="M100 210 Q120 226 140 210 L146 300 L94 300Z" fill="${CK.white}"/>${spark(120,246,.8,"#D97757",0)}`:`<path d="M100 212 Q120 232 140 212" stroke="${CK.white}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  const raise=arm==="left"?`<path d="M78 222 Q52 196 40 150" stroke="${top}" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="38" cy="140" r="12" fill="${skin}"/>`:
              arm==="right"?`<path d="M162 222 Q188 196 200 150" stroke="${top}" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="202" cy="140" r="12" fill="${skin}"/>`:"";
  return `${raise}<path d="M108 186 L132 186 L134 214 L106 214Z" fill="${skinS}"/><path d="M58 300 Q56 226 84 212 Q100 204 108 206 Q120 216 132 206 Q140 204 156 212 Q184 226 182 300Z" fill="${top}"/>${apron}<path d="M70 240 Q78 268 76 300 M170 240 Q162 268 164 300" stroke="${topS}" stroke-width="2.4" fill="none" opacity=".7"/>`;
}
function legs(look){
  const p=look.legs||"#2E2A33", shoe="#1B1620";
  if(look.skirt) return `<path d="M62 296 L178 296 L194 372 L46 372Z" fill="${look.skirt}"/><rect x="84" y="370" width="16" height="52" fill="${look.skin}"/><rect x="140" y="370" width="16" height="52" fill="${look.skin}"/><ellipse cx="92" cy="426" rx="18" ry="7" fill="${shoe}"/><ellipse cx="148" cy="426" rx="18" ry="7" fill="${shoe}"/>`;
  return `<path d="M72 296 L118 296 L114 422 L84 422Z" fill="${p}"/><path d="M122 296 L168 296 L156 422 L126 422Z" fill="${p}"/><ellipse cx="96" cy="426" rx="20" ry="7" fill="${shoe}"/><ellipse cx="144" cy="426" rx="20" ry="7" fill="${shoe}"/>`;
}
/* a person in the scene: x = centre, y = feet (standing) or the bottom of the bust (seated) */
function person(look,m,x,y,s,opt){
  opt=opt||{};
  const ty=opt.stand?y-432*s:y-300*s;
  return `<g transform="translate(${x-120*s} ${ty}) scale(${s})"><g class="idle ${opt.k||""}"><g filter="url(#cut)">${opt.stand?legs(look):""}${torso(look,opt.arm)}${head(look,m)}</g></g></g>`;
}
function face(look,m){return `<svg viewBox="50 2 140 196" aria-hidden="true">${head(look,m||"smile")}</svg>`;}

/* ============================= helpers ============================= */
let D=null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vcls=v=>(v||"").split(" ")[0];
const staff=id=>D.staff.find(s=>s.id===id);
const av=(id,m,sm)=>{const s=staff(id);return s?`<span class="avatar ${sm?"sm":""}" title="${esc(s.name)} · ${esc(s.role)}">${face(s.look,m)}</span>`:"";};
// who the office is for: names, cities and the team come from the profile (D.brand), never from the page
const SITE=()=>String((BR().website||"our website")).replace(/^https?:\/\//,"").replace(/\/.*$/,"");
const BR=()=>(D&&D.brand)||{name:"the brand",short:"the brand",lead:"the lead",team:[],city:"the city",team_city:"",scene:"city",market:"the market"};
const LEAD=()=>BR().lead, SHORTN=()=>BR().short, CITY=()=>BR().city, TCITY=()=>BR().team_city||"the team", TEAMS=()=>BR().team||[];
const NYC=()=>BR().scene==="newyork";
const teamTxt=()=>{const t=TEAMS();return !t.length?"the team":t.length<=2?t.join(" and "):t.slice(0,-1).join(", ")+" and "+t[t.length-1];};
const TEAMC=["var(--clay)","var(--green)","var(--slate)","var(--gold)","var(--sage)"];

function radar(sc,size,labels){
  const c=size/2,r=size/2-(labels?22:6),n=AX.length,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+Math.cos(a)*r*v,c+Math.sin(a)*r*v];};

  AX.forEach((_,i)=>{const [x,y]=pt(i,1);g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#E3DFD6"/>`;});

  let lab="";if(labels)AX.forEach(([k,l],i)=>{const [x,y]=pt(i,1.18);const a=x>c+4?"start":x<c-4?"end":"middle";lab+=`<text x="${x}" y="${y}" font-size="11" font-weight="600" text-anchor="${a}" dominant-baseline="middle" fill="#716A56">${l} ${sc[k]||0}</text>`;});

}

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EFECEC" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${size*.28}" font-weight="800" fill="#2C332F">${v}</text></svg>`;}

/* ============================= New York time & the US calendar ============================= */
// The office keeps its city's time. D.calendar (agency/calendar_world.py) is the one list of the market's holidays,
// observances, retail moments and the brand's own dates; everything here reads it with today's date in the office.
let NY="America/New_York", TEAMTZ="Asia/Ho_Chi_Minh";  // the office's and the team's time zones, set from D on entry
function nyNow(){const o={};new Intl.DateTimeFormat("en-US",{timeZone:NY,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hour12:false})
  .formatToParts(new Date()).forEach(p=>o[p.type]=p.value);return {date:`${o.year}-${o.month}-${o.day}`,h:(+o.hour)%24,m:+o.minute,wd:o.weekday};}
const todayNY=()=>nyNow().date;
const addDays=(iso,n)=>new Date(Date.parse(iso+"T12:00:00Z")+n*864e5).toISOString().slice(0,10);
const dayDiff=(a,b)=>Math.round((Date.parse(b+"T12:00:00Z")-Date.parse(a+"T12:00:00Z"))/864e5);
const occ=()=>D.calendar||[];
const KIND={federal:["Federal holiday","#9A4A3A"],culture:["Cultural moment","#4E5D78"],faith:["Faith & festival","#7B4A63"],
  retail:["Retail moment","#A88A4E"],month:["Heritage month","#6F7D63"],civic:["Civic","#5B5F6E"],brand:["Brand date","#2C332F"]};
function seasons(){
  // occasions whose decor is up today (lead days early), strongest first, plus the season outside the windows
  const t=todayNY(), m=+t.slice(5,7);
  // equal weight: the occasion nearest today wins (New Year's Eve over day 6 of Kwanzaa)
  const on=occ().filter(e=>e.decor&&addDays(e.date,-(e.lead||0))<=t&&t<=e.end).sort((a,b)=>b.weight-a.weight||Math.abs(dayDiff(t,a.date))-Math.abs(dayDiff(t,b.date)));
  const base=[12,1,2].includes(m)?"winter":[3,4,5].includes(m)?"spring":[6,7,8].includes(m)?"summer":"autumn";
  const label=e=>{const n=dayDiff(t,e.date);return n>0?`${e.name.replace(/ \(.*\)$/,"")} in ${n} day${n>1?"s":""}`:e.name.replace(/ \(.*\)$/,"");};
  return {on,keys:[...new Set(on.map(e=>e.decor))],top:on[0]||null,base,labels:on.filter(e=>e.weight>=2).slice(0,2).map(label)};
}
function skyPhase(){const h=nyNow().h;return h<6||h>=20?"night":h<8?"dawn":h<17?"day":h<18?"golden":"dusk";}
const SKY={day:["#8FBCE6","#D9EAF6"],dawn:["#B7CDEB","#F6D6C3"],golden:["#E9B98A","#F7DDB5"],dusk:["#4E4A8C","#E2998A"],night:["#10142B","#2E3360"]};

<script>

    <path d="M60 9 q40 -3 90 1 M210 30 q30 2 70 -1 M10 31 q30 -2 70 1" stroke="#B0825A" stroke-width="1.2" fill="none"/></pattern>

  <clipPath id="arch"><path d="M0 120 Q0 0 115 0 Q230 0 230 120 V450 H0Z"/></clipPath>
  </defs>`;
}
/* --- outside the windows --- */
function skyline(w,base,col,seed,minH,maxH){let s="",x=-6,i=seed;while(x<w){const bw=16+rnd(i)*26,bh=minH+rnd(i+.5)*(maxH-minH);s+=`<rect x="${x.toFixed(1)}" y="${(base-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${(bh+2).toFixed(1)}" fill="${col}"/>`;x+=bw+1;i++;}return s;}
function waterTower(x,y,s,col){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${col}"><path d="M-9 0 L-6 -16 M9 0 L6 -16 M0 0 V-16" stroke="${col}" stroke-width="2"/><rect x="-10" y="-34" width="20" height="18"/><path d="M-12 -34 L0 -46 L12 -34Z"/></g>`;}
function windowsLit(w,y0,y1,seed,col,n){let s="";for(let i=0;i<n;i++){s+=`<rect x="${(rnd(seed+i)*w).toFixed(1)}" y="${(y0+rnd(seed+i*1.7)*(y1-y0)).toFixed(1)}" width="4" height="5" fill="${col}"/>`;}return s;}
function esb(cx,base,phase,cols){
  const lit=phase!=="day"&&phase!=="dawn", body=lit?"#2C304D":"#6F7789", c=(cols&&cols.length?cols:["#FFFFFF"]);
  const L=k=>lit?c[k%c.length]:"#A9AEB9";
  return `${lit?`<circle cx="${cx}" cy="${base-232}" r="46" fill="${c[0]}" opacity=".16"/>`:""}
    <rect x="${cx-34}" y="${base-170}" width="68" height="172" fill="${body}"/><rect x="${cx-26}" y="${base-205}" width="52" height="36" fill="${body}"/>
    <rect x="${cx-18}" y="${base-232}" width="36" height="28" fill="${L(0)}"/><rect x="${cx-12}" y="${base-256}" width="24" height="25" fill="${L(1)}"/>
    <path d="M${cx-6} ${base-256} L${cx-2} ${base-300} H${cx+2} L${cx+6} ${base-256}Z" fill="${L(2)}"/><rect x="${cx-.8}" y="${base-326}" width="1.6" height="27" fill="${lit?"#C9CCD6":"#5E6270"}"/>
    ${lit?windowsLit(60,base-166,base-6,7,"#F7D78A",36).replace(/x="/g,`transform="translate(${cx-32} 0)" x="`):""}`;
}
function chrysler(cx,base,phase){
  const lit=phase!=="day"&&phase!=="dawn", body=lit?"#30344F":"#A2A8B5", crown=lit?"#5A5F80":"#D3D8E1", tri=lit?"#F7D78A":"#EEF1F6";
  let s=`<rect x="${cx-24}" y="${base-190}" width="48" height="192" fill="${body}"/>`;
  for(let i=0;i<5;i++){const wd=44-i*8,yb=base-190-i*15;
    s+=`<path d="M${cx-wd/2} ${yb} Q${cx-wd/2} ${yb-22} ${cx} ${yb-25} Q${cx+wd/2} ${yb-22} ${cx+wd/2} ${yb}Z" fill="${crown}" stroke="${body}" stroke-width="1.5"/>`;
    [-wd/4,0,wd/4].forEach(dx=>{s+=`<path d="M${cx+dx-2.5} ${yb-3} L${cx+dx} ${yb-11} L${cx+dx+2.5} ${yb-3}Z" fill="${tri}"/>`;});}
  s+=`<path d="M${cx-3} ${base-262} L${cx} ${base-320} L${cx+3} ${base-262}Z" fill="${crown}"/>`;
  if(lit)s+=windowsLit(40,base-180,base-6,3,"#F7D78A",22).replace(/x="/g,`transform="translate(${cx-20} 0)" x="`);
  return s;
}
function bridge(w,h,phase){
  const lit=phase!=="day"&&phase!=="dawn", stone=lit?"#5F566B":"#BCA88B", water=lit?"#131A35":"#6F8FB0", cable=lit?"#8D94B9":"#5E6476", deck=h*.68, tx=w*.5;
  const q=(x0,y0,cx,cy,x1,y1,t)=>[(1-t)*(1-t)*x0+2*t*(1-t)*cx+t*t*x1,(1-t)*(1-t)*y0+2*t*(1-t)*cy+t*t*y1];
  let s=skyline(w,h*.74,lit?"#262B4A":"#9AA6BA",21,20,90)+`<rect y="${h*.74}" width="${w}" height="${h*.26}" fill="${water}"/>`;
  const L=[-10,deck-50,tx/2,deck+16,tx-16,deck-150], R=[tx+16,deck-150,tx+(w-tx)/2,deck+16,w+10,deck-50];
  [L,R].forEach(c=>{s+=`<path d="M${c[0]} ${c[1]} Q${c[2]} ${c[3]} ${c[4]} ${c[5]}" stroke="${cable}" stroke-width="2.4" fill="none"/>`;
    for(let t=.06;t<1;t+=.08){const [x,y]=q(...c,t);s+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} V${deck}" stroke="${cable}" stroke-width=".8"/>`;if(lit)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="#FFE7A8" class="twinkle ${["","b","c"][Math.round(t*12)%3]}"/>`;}});
  s+=`<rect x="0" y="${deck}" width="${w}" height="7" fill="${lit?"#1E2238":"#4E5466"}"/>
    <path d="M${tx-26} ${h*.8} V${deck-160} H${tx+26} V${h*.8}Z" fill="${stone}"/><rect x="${tx-30}" y="${deck-166}" width="60" height="9" fill="${stone}"/>
    <path d="M${tx-19} ${deck+2} V${deck-96} Q${tx-11} ${deck-122} ${tx-4} ${deck-96} V${deck+2}Z M${tx+4} ${deck+2} V${deck-96} Q${tx+11} ${deck-122} ${tx+19} ${deck-96} V${deck+2}Z" fill="url(#sky)"/>`;
  if(lit)for(let i=0;i<9;i++)s+=`<rect x="${(rnd(i+40)*w).toFixed(1)}" y="${(h*.78+rnd(i+41)*h*.18).toFixed(1)}" width="${(8+rnd(i)*14).toFixed(1)}" height="1.6" fill="#F7D78A" opacity=".55"/>`;

function nycView(w,h,phase,kind,se){

    if(kind==="chrysler")s+=`<circle cx="${w*.8}" cy="${h*.13}" r="15" fill="#F4EFD7"/><circle cx="${w*.8+6}" cy="${h*.13-4}" r="13" fill="url(#sky)"/>`;}

  if(kind==="bridge"&&NYC())return s+bridge(w,h,phase);

  if(lit)s+=windowsLit(w,h*.72,h*.98,kind==="esb"?11:17,"#F7D78A",26);

}
function weather(se,phase,which){

  if(se.base==="winter")for(let i=0;i<20;i++)s+=`<circle cx="${(rnd(i+which*9)*230).toFixed(1)}" cy="0" r="${1.4+rnd(i)*2}" fill="#fff" opacity=".9" class="snow" style="animation-delay:-${(rnd(i*2+which)*9).toFixed(2)}s;animation-duration:${(7+rnd(i)*5).toFixed(1)}s"/>`;

function wallCalendar(x,y){

  if(D.chamber&&D.chamber.read)pool.push(["mocha",D.chamber.read]);

  const rdc=radarData();if(rdc)rdc.moves.filter(x=>x.heat==="now").slice(0,3).forEach(x=>pool.push(["espresso",`${x.title}.`]));
  ((D.brands&&D.brands.moves)||[]).slice(0,3).forEach(x=>pool.push(["chai",`${x.brand}: ${x.title}.`]));
  if(creativePlays().length)pool.push(["tonic",`${creativePlays().length} ad tests live. Hooks die at a thousand impressions.`]);
  // the office's time of day

  const fun={halloween:[["chai","Who carved the pumpkin? It's watching me."],["mocha","The Village parade is on the 31st."]],thanksgiving:[["matcha","Pie is for after the huddle."],["tonic","The parade balloons go up Thursday morning."]],
    christmas:[["tonic","The tree is crooked. Leave it."],["mocha","Rockefeller tree, but smaller. Ours."]],hanukkah:[["latte","Another candle tonight."]],kwanzaa:[["coca","Another candle on the kinara tonight."]],
    newyear:[["coca",`Happy New Year from ${CITY()}.`]],lny:[["coca","Lì xì on the table — one each."]],midautumn:[["mocha","Star lanterns up. Mooncakes on the table."]],
    pride:[["chai","Pride bunting's up. March is the last Sunday."]],july4:[["coca","Fireworks over the East River tonight."]],valentine:[["tonic","Someone left roses on the table."]],
    stpatricks:[["chai","Fifth Avenue's all green today."]],diwali:[["mocha","Diyas on the sills tonight."]],shopping:[["matcha","Retail weekend. Watch the inboxes."]],vote:[["latte","Polls are open. Sticker's on the laptop."]],

  se.keys.forEach(k=>(fun[k]||[]).forEach(x=>pool.push(x)));

    .sort((a,b)=>b.relevance-a.relevance), w=r.watch||{};
  return {headline:r.summary,at:r.generated_at,moves:p.slice(0,3),signals:p.slice(3),skip:[],week:r.calendar||[],brief:r.creator_brief||null,

function radarChart(items,areas){
  // distance from the centre = how much it matters to us; colour = how soon
  const W=520,c=W/2,R=190,n=areas.length,step=2*Math.PI/n,pt=(a,r)=>[c+Math.cos(a)*r,c+Math.sin(a)*r];
  let g=[.35,.7,1].map(k=>`<circle cx="${c}" cy="${c}" r="${R*k}" fill="none" stroke="#E3DFD6"/>`).join("");
  areas.forEach((sec,i)=>{const a=-Math.PI/2+i*step,[x,y]=pt(a,R),[lx,ly]=pt(a+step/2,R+30);
    g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#E3DFD6"/><text x="${lx}" y="${ly}" font-size="11" font-weight="700" fill="#716A56" text-anchor="middle" dominant-baseline="middle">${esc(sec)}</text>`;
    const mine=items.filter(it=>it.area===sec);
    mine.forEach((it,k)=>{const a2=a+step*(k+1)/(mine.length+1),r=R*(1.04-(it.relevance||1)/10),[x2,y2]=pt(a2,Math.max(14,r));
      g+=`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="7" fill="${HEATC[it.heat]||"#716A56"}" fill-opacity=".85" stroke="#fff" stroke-width="1.5" data-rid="${it._i}" style="cursor:pointer"><title>${esc(it.name)} · for us ${it.relevance}/10 · ${esc(it.heat)}</title></circle>`;});});
  g+=`<line x1="${c}" y1="${c}" x2="${c}" y2="${c-R}" stroke="#2C332F" stroke-width="1.5" opacity=".35"><animateTransform attributeName="transform" type="rotate" from="0 ${c} ${c}" to="360 ${c} ${c}" dur="6s" repeatCount="indefinite"/></line><circle cx="${c}" cy="${c}" r="4" fill="#2C332F"/>`;

function monthGrid(ym){
  const first=ym+"-01", dow=new Date(first+"T12:00:00Z").getUTCDay(), Y=+ym.slice(0,4), M=+ym.slice(5,7), days=new Date(Date.UTC(Y,M,0)).getUTCDate(), t=todayNY(), last=`${ym}-${days}`;

  const months=occ().filter(e=>e.kind==="month"&&e.date<=last&&e.end>=first);
  let cells="";for(let i=0;i<dow;i++)cells+=`<div class="cd empty"></div>`;
  for(let d=1;d<=days;d++){const iso=`${ym}-${String(d).padStart(2,"0")}`;
    const es=occ().filter(e=>e.kind!=="month"&&(e.date===iso||(e.weight>=3&&e.date<iso&&iso<=e.end)));

function viText(t){const k=t.trim();if(!k)return null;if(VI[k])return t.replace(k,VI[k]);for(const [rx,to] of VIRX){if(rx.test(k))return t.replace(k,k.replace(rx,to));}return null;}
function viWalk(root){if(LANG!=="vi"||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode&&n.parentNode.nodeName;return p==="SCRIPT"||p==="STYLE"?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  const todo=[];while(w.nextNode())todo.push(w.currentNode);todo.forEach(n=>{const v=viText(n.nodeValue);if(v!=null&&v!==n.nodeValue)n.nodeValue=v;});
  root.querySelectorAll&&root.querySelectorAll("[aria-label],[title]").forEach(el=>{["aria-label","title"].forEach(a=>{const v=el.getAttribute(a);const t=v&&viText(v);if(t)el.setAttribute(a,t);});});}

  (d.plays||[]).forEach(p=>{["hooks","approach","tactics","references","hashtags"].forEach(k=>p[k]=p[k]||[]);p.due=p.due||"";p.funnel=p.funnel||"Awareness";});}

  LSECT.forEach(k=>{if(src&&src[k]!==undefined)put(k,clone(src[k]));else if(LBASE[k]!==undefined)put(k,clone(LBASE[k]));});normalise(D);
  document.querySelectorAll("#langsw button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  if(!LOBS){LOBS=new MutationObserver(ms=>{if(LANG!=="vi")return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===3){const v=viText(n.nodeValue);if(v!=null&&v!==n.nodeValue)n.nodeValue=v;}else if(n.nodeType===1)viWalk(n);}));});
    LOBS.observe(document.body,{childList:true,subtree:true,characterData:false});}
  if(redraw){const se=drawOffice();lockBadges();hud(se);startChatter(se);
    $("#dock").innerHTML=ROOMS.map(([r,id,l])=>`<button data-open="${r}" class="${isLocked(r)?"locked":""}">${roomIcon(r,id)}${l}${isLocked(r)?`<span class="lk" aria-label="full version">🔒</span>`:""}</button>`).join("");

  viWalk(document.body);
}
function initLang(){

  const L=D.lang||{};if(!L.second)return;$("#langsw").classList.add("on");

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
  const v=JSON.parse($("#vault").textContent);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(v.salt),iterations:v.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(v.iv)},key,b64(v.ct))));
}

  let sealed=false;try{sealed=!!JSON.parse($("#vault").textContent).ct;}catch(e){}
  if(!sealed){document.body.insertAdjacentHTML("beforeend",`<div class="gate"><div class="card"><h1 style="font-family:var(--display);font-size:26px;margin:0">The Insight Café</h1>
    <p class="muted" style="margin:8px 0 0">The office opens after the first report. In this folder, run <span class="mono">python -m agency.run</span>.</p></div></div>`);return;}
  $("#gateFace").innerHTML=`<svg viewBox="40 0 160 300" style="width:120px;height:170px;display:block;margin:-6px auto 6px" aria-hidden="true"><defs>${CUT}</defs><g filter="url(#cut)">${torso({hair:"bun",top:"#A8443A",skin:"#EDB892"})}${head({hair:"bun",top:"#A8443A",skin:"#EDB892",acc:"clip"},"wink")}</g></svg>`;
  const saved=store.get("agency-pass");
  if(saved){try{enter(await unlock(saved));return;}catch(e){store.del("agency-pass");}}
  $("#gate").hidden=false;$("#pass").focus();
  $("#gateForm").onsubmit=async ev=>{ev.preventDefault();$("#gateErr").textContent="";const p=$("#pass").value;
    try{const d=await unlock(p);store.set("agency-pass",p);enter(d);}catch(e){$("#gateErr").textContent="That's not it. Ask the office's lead for the passphrase.";}};
})();
</script>
</body>
</html>
